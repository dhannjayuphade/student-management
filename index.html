<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Study Manager</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= ROLE SELECT ================= -->

<div id="loginPage">

  <div class="login-card">

    <div class="logo">📚</div>

    <h1>Student Study Manager</h1>

    <p>Institute Management System</p>

    <h3>Select Your Role</h3>

    <div class="role-buttons">

      <button onclick="selectRole('teacher')">
        👨‍🏫 Teacher
      </button>

      <button onclick="selectRole('principal')">
        🏫 Principal
      </button>

      <button onclick="selectRole('admin')">
        🛡️ Admin
      </button>

    </div>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- ================= SUBJECT SELECT ================= -->

<div id="subjectPage" class="hidden">

  <div class="login-card">

    <div class="logo">👨‍🏫</div>

    <h2>Teacher</h2>

    <p>Select Subject</p>

    <div class="subject-buttons">

      <button onclick="selectSubject('Physics')">
        ⚛️ Physics
      </button>

      <button onclick="selectSubject('Chemistry')">
        🧪 Chemistry
      </button>

      <button onclick="selectSubject('Mathematics')">
        📐 Mathematics
      </button>

      <button onclick="selectSubject('Biology')">
        🧬 Biology
      </button>

    </div>

    <button class="secondary" onclick="backToRoles()">
      ← Back
    </button>

  </div>

</div>


<!-- ================= APP ================= -->

<div id="app" class="hidden">

  <header>

    <div>
      <h1>📚 Student Study Manager</h1>
      <small id="userInfo"></small>
    </div>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </header>


  <!-- ================= NAV ================= -->

  <nav>

    <button onclick="showPage('dashboard')">
      🏠 Dashboard
    </button>

    <button onclick="showPage('students')">
      👨‍🎓 Students
    </button>

    <button id="teacherNav" onclick="showPage('tasks')">
      📚 Tasks
    </button>

    <button id="peopleNav" onclick="showPage('people')">
      👥 Users
    </button>

    <button onclick="showPage('reports')">
      📊 Reports
    </button>

  </nav>


  <main>

    <!-- ================= DASHBOARD ================= -->

    <section id="dashboard" class="page">

      <h2>🏠 Dashboard</h2>

      <div class="cards">

        <div class="card">
          <span>👨‍🎓</span>
          <b id="totalStudents">0</b>
          <p>Students</p>
        </div>

        <div class="card">
          <span>👨‍🏫</span>
          <b id="totalTeachers">0</b>
          <p>Teachers</p>
        </div>

        <div class="card">
          <span>📚</span>
          <b id="totalTasks">0</b>
          <p>Tasks</p>
        </div>

        <div class="card">
          <span>🟢</span>
          <b id="totalCompleted">0</b>
          <p>Completed</p>
        </div>

      </div>

      <div id="dashboardContent"></div>

    </section>


    <!-- ================= STUDENTS ================= -->

    <section id="students" class="page hidden">

      <h2>👨‍🎓 Students</h2>

      <div id="studentForm" class="form">

        <input
          id="studentName"
          placeholder="Student Name"
        >

        <input
          id="rollNo"
          type="number"
          placeholder="Roll Number"
        >

        <input
          id="studentPhone"
          placeholder="Phone Number"
        >

        <input
          id="studentClass"
          placeholder="Class / Batch"
        >

        <button onclick="addStudent()">
          ➕ Add Student
        </button>

      </div>

      <input
        id="studentSearch"
        class="search"
        placeholder="🔎 Search student..."
        oninput="renderStudents()"
      >

      <div id="studentGrid"></div>

    </section>


    <!-- ================= TASKS ================= -->

    <section id="tasks" class="page hidden">

      <h2>📚 Teacher Tasks</h2>

      <div id="taskForm" class="form">

        <label>Subject</label>

        <select id="taskSubject">

          <option value="Physics">
            Physics
          </option>

          <option value="Chemistry">
            Chemistry
          </option>

          <option value="Mathematics">
            Mathematics
          </option>

          <option value="Biology">
            Biology
          </option>

        </select>


        <label>Task Type</label>

        <select id="taskType">

          <option>Class Work</option>

          <option>Home Work</option>

          <option>Question Answer</option>

          <option>Question Paper Solve</option>

          <option>CET Questions</option>

          <option>Activity</option>

        </select>


        <input
          id="taskTitle"
          placeholder="Task / Chapter"
        >


        <textarea
          id="taskDescription"
          placeholder="Task description"
        ></textarea>


        <input
          id="taskDate"
          type="date"
        >


        <button onclick="addTask()">
          ➕ Assign Task To All Students
        </button>

      </div>

      <div id="taskList"></div>

    </section>


    <!-- ================= USERS ================= -->

    <section id="people" class="page hidden">

      <h2>👥 Users</h2>

      <div id="usersList"></div>

    </section>


    <!-- ================= REPORTS ================= -->

    <section id="reports" class="page hidden">

      <h2>📊 Reports</h2>

      <select
        id="reportStudent"
        onchange="showStudentReport()"
      >

        <option value="">
          Select Student
        </option>

      </select>

      <div id="reportBox"></div>

    </section>


    <!-- ================= PROFILE ================= -->

    <section id="profile" class="page hidden">

      <button onclick="showPage('students')">
        ← Back
      </button>

      <div id="profileBox"></div>

    </section>

  </main>

</div>


<footer>
  Software created by Dhannjay Uphade
</footer>


<script type="module" src="app.js"></script>

</body>
      </html>
